workflows:
  fortivum-android:
    name: Fortivum Android APK
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Instalar Gradle 8.7
        script: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH="/tmp/gradle-8.7/bin:$PATH"
          gradle --version
      - name: Compilar APK Android
        script: |
          export PATH="/tmp/gradle-8.7/bin:$PATH"
          gradle assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/debug/*.apk
